var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");};
function toast(m){var e=document.getElementById('msg');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none';},2200);}
async function call(action,data){
  try{
    var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em,password:pw,action:action,data:data||{}})});
    var j=await r.json().catch(function(){return {ok:false,message:'Réponse invalide du serveur ('+r.status+').'};});
    return j;
  }catch(e){
    return {ok:false,message:'Connexion impossible au serveur. Vérifiez votre connexion internet et réessayez.'};
  }
}
document.getElementById('loginBtn').onclick=async function(){
  em=document.getElementById('em').value;
  pw=document.getElementById('pw').value;
  var r=await call('login');
  if(!r.ok){document.getElementById('loginErr').textContent=r.message||'E-mail ou mot de passe incorrect.';return;}
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await load();
};
document.getElementById('em').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginBtn').click();});
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginBtn').click();});

async function load(){
  var loaded=await call('site');
  if(!loaded.ok){toast(loaded.message||'Impossible de charger les réglages du site.');return;}
  site=loaded;
  var a=await call('listAdmins');
  if(!a.ok)toast(a.message||'Impossible de charger les administrateurs.');
  admins=a.admins||[];meId=a.currentId||'';render();
}

var TABS=[["eleves","Élèves & notes"],["identite","Logo & icône"],["contacts","Coordonnées"],["apparence","Apparence & couleurs"],["textes","Textes"],["medias","Médiathèque"],["pages","Pages"],["admins","Administrateurs"],["compte","Mot de passe"]];
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join('');
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-tab');render();};});
  var v=document.getElementById('view');
  if(tab==='eleves'){studentsView(v);return;}
  if(tab==='identite') v.innerHTML=identityView();
  if(tab==='contacts') v.innerHTML=settingsView();
  if(tab==='apparence') v.innerHTML=appearanceView();
  if(tab==='textes') v.innerHTML=textsView();

}

async function squareIcon(f){
  if(!f.type.startsWith('image/'))throw new Error('Choisissez une image.');
  var url=URL.createObjectURL(f);
  try{var img=new Image();img.src=url;await img.decode();var c=document.createElement('canvas');c.width=c.height=64;
    var x=c.getContext('2d');if(!x)throw new Error('Impossible de préparer l’icône.');
    var scale=Math.min(64/img.width,64/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(64-w)/2,(64-h)/2,w,h);return c.toDataURL('image/png');
  }finally{URL.revokeObjectURL(url);}
}

function mediaName(m){ return m.title || (m.mkey? (SLOTS[m.mkey]? SLOTS[m.mkey].label : m.mkey) : m.path.split('/').pop()); }

function adminsView(){
  var html='<div class="card"><h3>Ajouter un administrateur</h3><label>Adresse e-mail</label><input id="naEmail" type="email">'+
   '<label>Mot de passe (6 caractères minimum)</label><input id="naPwd">'+
   '<p><button class="primary" id="naAdd">Ajouter</button></p></div>';
  html+='<div class="card"><h3>Administrateurs existants</h3>'+(admins.length?admins.map(function(a){
    return '<div data-adm="'+a.id+'" style="border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px">'+
      '<label>Adresse e-mail'+(a.id===meId?' (vous)':'')+'</label><input data-ae value="'+esc(a.email)+'">'+
      '<label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input data-ap value="">'+
      '<p><button class="primary" data-asave="'+a.id+'">Enregistrer</button> '+
      '<button class="ghost" data-adel="'+a.id+'">Supprimer</button></p></div>';
  }).join(''):'<p><small class="hint">Chargement…</small></p>')+'</div>';
  return html;
}
function pagesView(){
  return '<div class="card"><h3>Nouvelle page</h3>'+pageForm({})+'</div>'+
    (site.pages||[]).map(function(p){return '<div class="card">'+pageForm(p)+'</div>';}).join('');
}
function pageForm(p){
  var id=p.id||'';
  return '<div data-page="'+id+'">'+
    '<label>Nom dans le menu</label><input data-f="label" value="'+esc(p.label)+'">'+
    '<label>Adresse (facultatif)</label><input data-f="slug" value="'+esc(p.slug)+'">'+
    '<label>Titre</label><input data-f="title" value="'+esc(p.title)+'">'+
    '<label>Introduction</label><textarea data-f="intro">'+esc(p.intro)+'</textarea>'+
    '<label>Contenu</label><textarea data-f="body" style="min-height:160px">'+esc(p.body)+'</textarea>'+
    '<label>Insérer une image ou une vidéo dans le contenu</label><p>'+(site.media||[]).map(function(m){
      return '<button class="ghost" data-ins="'+m.id+'">'+(m.kind==='video'?'🎬 ':'🖼 ')+esc(mediaName(m))+'</button> ';
    }).join('')+'</p>'+
    '<label>Média d\'en-tête</label><select data-f="image_key"><option value="">Aucun</option>'+
      (site.media||[]).map(function(m){var v=m.mkey||m.id;
        return '<option value="'+esc(v)+'"'+((p.image_key||'')===v?' selected':'')+'>'+esc(mediaName(m))+(m.kind==='video'?' (vidéo)':'')+'</option>';}).join('')+
    '</select>'+
    '<label>Position dans le menu</label><input data-f="position" type="number" value="'+(p.position==null?100:p.position)+'">'+
    '<label><input data-f="visible" type="checkbox" style="width:auto" '+(p.visible===false?'':'checked')+'> Visible</label>'+
    '<p><button class="primary" data-psave="'+id+'">Enregistrer</button> '+(id?'<button class="ghost" data-pdel="'+id+'">Supprimer</button>':'')+'</p></div>';
}
function fileToB64(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.readAsDataURL(f);});}
function bindInsert(){
  document.querySelectorAll('[data-ins]').forEach(function(b){b.onclick=function(){
    var ta=b.closest('[data-page]').querySelector('[data-f="body"]');
    ta.value=ta.value.replace(/\s*$/,'')+'\n\n[[media:'+b.getAttribute('data-ins')+']]\n\n';
    toast('Média inséré — pensez à enregistrer.');};});
}
function bind(){
  ['brandLogo','brandIcon'].forEach(function(id){var input=document.getElementById(id);if(!input)return;
    input.onchange=async function(){var f=input.files[0];if(!f)return;input.disabled=true;
      try{var icon=await squareIcon(f),entries={favicon_data:icon, favicon_mode:id==='brandLogo'?'logo':'custom'};
        if(id==='brandLogo'){var up=await call('upload',{filename:f.name,base64:await fileToB64(f),contentType:f.type,kind:'image',mkey:'logo'});if(!up.ok)throw new Error(up.message);entries.favicon_source=up.path;}
        var r=await call('saveSettings',{entries:entries});if(!r.ok)throw new Error(r.message);toast('Enregistré et publié');await load();
        document.querySelector('link[rel="icon"]').href="https://site-control-studio.lovable.app"+'/api/public/favicon?v='+Date.now();
      }catch(e){toast(e.message||'Modification impossible.');}finally{input.disabled=false;}};});
  var useLogo=document.getElementById('useLogoIcon');if(useLogo)useLogo.onclick=async function(){var r=await call('saveSettings',{entries:{favicon_mode:'logo'}});toast(r.ok?'Logo utilisé comme icône':r.message);await load();};
  document.querySelectorAll('[data-color-for]').forEach(function(picker){picker.oninput=function(){var key=picker.getAttribute('data-color-for');var field=document.querySelector('[data-set="'+key+'"]');if(field)field.value=picker.value;};});
  var s=document.getElementById('saveSet');
  if(s) s.onclick=async function(){var e={};document.querySelectorAll('[data-set]').forEach(function(i){e[i.getAttribute('data-set')]=i.value;});
    var r=await call('saveSettings',{entries:e});toast(r.ok?'Enregistré':(r.message||'Erreur'));await load();};
  var t=document.getElementById('saveTxt');
  if(t) t.onclick=async function(){var e={};document.querySelectorAll('[data-text]').forEach(function(i){e[i.getAttribute('data-text')]=i.value;});
    var r=await call('saveTexts',{entries:e});toast(r.ok?'Enregistré':(r.message||'Erreur'));};
  var np=document.getElementById('npBtn');
  if(np) np.onclick=async function(){var r=await call('changePassword',{next:document.getElementById('np').value});
    if(r.ok){pw=document.getElementById('np').value;toast('Mot de passe modifié');}else toast(r.message||'Erreur');};
  var na=document.getElementById('naAdd');
  if(na) na.onclick=async function(){
    var r=await call('saveAdmin',{email:document.getElementById('naEmail').value,password:document.getElementById('naPwd').value});
    toast(r.ok?'Administrateur ajouté':(r.message||'Erreur')); if(r.ok) await load();};
  document.querySelectorAll('[data-asave]').forEach(function(b){b.onclick=async function(){
    var box=b.closest('[data-adm]');
    var r=await call('saveAdmin',{id:b.getAttribute('data-asave'),email:box.querySelector('[data-ae]').value,password:box.querySelector('[data-ap]').value});
    toast(r.ok?'Administrateur mis à jour':(r.message||'Erreur')); if(r.ok) await load();};});
  document.querySelectorAll('[data-adel]').forEach(function(b){b.onclick=async function(){
    if(!confirm('Supprimer cet administrateur ?'))return;
    var r=await call('deleteAdmin',{id:b.getAttribute('data-adel')});
    toast(r.ok?'Administrateur supprimé':(r.message||'Erreur')); if(r.ok) await load();};});
  var am=document.getElementById('addMedia');
  if(am) am.onclick=async function(){
    var f=document.getElementById('newFile').files[0]; if(!f){toast('Choisissez un fichier');return;}
    toast('Téléversement…');
    var r=await call('upload',{filename:f.name,base64:await fileToB64(f),contentType:f.type,kind:f.type.indexOf('video')===0?'video':'image',
      title:document.getElementById('newTitle').value,subtitle:document.getElementById('newSub').value});
    toast(r.ok?'Média ajouté':(r.message||'Erreur'));await load();};
  document.querySelectorAll('[data-msave]').forEach(function(b){b.onclick=async function(){
    var id=b.getAttribute('data-msave');
    var r=await call('saveMedia',{id:id,title:document.querySelector('[data-mt="'+id+'"]').value,subtitle:document.querySelector('[data-ms="'+id+'"]').value});
    toast(r.ok?'Enregistré':(r.message||'Erreur'));};});
  document.querySelectorAll('[data-mdel]').forEach(function(b){b.onclick=async function(){
    if(!confirm('Supprimer ce média ?'))return;var r=await call('deleteMedia',{id:b.getAttribute('data-mdel')});
    toast(r.ok?'Supprimé':(r.message||'Erreur'));await load();};});
  document.querySelectorAll('[data-mrep]').forEach(function(b){b.onclick=function(){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*,video/mp4,video/webm,video/*';
    inp.onchange=async function(){var f=inp.files[0];if(!f)return;toast('Téléversement…');
      var mkey=b.getAttribute('data-mrep');
      var isVid=f.type.indexOf('video')===0;
      var r=await call('upload',{filename:f.name,base64:await fileToB64(f),contentType:f.type,kind:isVid?'video':'image',
        mkey:mkey||null,mediaId:mkey?null:b.getAttribute('data-mid')});
      toast(r.ok?(isVid?'Vidéo publiée':'Image remplacée'):(r.message||'Erreur'));await load();};
    inp.click();};});
  document.querySelectorAll('[data-psave]').forEach(function(b){b.onclick=async function(){
    var box=b.closest('[data-page]');var p={};
    box.querySelectorAll('[data-f]').forEach(function(i){var k=i.getAttribute('data-f');
      p[k]= i.type==='checkbox'? i.checked : (k==='position'? Number(i.value||100) : i.value);});
    if(box.getAttribute('data-page')) p.id=box.getAttribute('data-page');
    if(!p.slug) p.slug=p.label;
    p.image_key=p.image_key||null;
    var r=await call('savePage',{page:p});toast(r.ok?'Page enregistrée':(r.message||'Erreur'));await load();};});
  document.querySelectorAll('[data-pdel]').forEach(function(b){b.onclick=async function(){
    if(!confirm('Supprimer cette page ?'))return;var r=await call('deletePage',{id:b.getAttribute('data-pdel')});
    toast(r.ok?'Page supprimée':(r.message||'Erreur'));await load();};});
  bindInsert();
}

var stList=null,stOpen=null,stDetail=null,stQ='',stF='all',stForm=null;
var ST_LBL={approved:'Approuvée',rejected:'Rejetée',pending:'En attente'};
function nz(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'');}
function f2(n){return n==null?'—':n.toFixed(2);}
function numv(v){if(v==null||String(v).trim()==='')return null;var n=Number(String(v).replace(',','.'));return isFinite(n)?n:null;}
function rowAvg(r){var x=r.notes.map(numv).filter(function(n){return n!==null;});return x.length?x.reduce(function(a,b){return a+b;},0)/x.length:null;}
function tabAvg(t){var x=t.rows.map(rowAvg).filter(function(n){return n!==null;});return x.length?x.reduce(function(a,b){return a+b;},0)/x.length:null;}
async function studentsView(v){
  if(stList===null){v.innerHTML='<div class="card">Chargement des élèves…</div>';var r=await call('listStudents');if(!r.ok){v.innerHTML='<div class="card">'+esc(r.message)+'</div>';return;}stList=r.students;}
  var s=settingsMap();
  var list=stList.filter(function(x){var t=nz(stQ);if(t&&nz(x.matricule+' '+x.nom+' '+x.prenom+' '+x.prenom+' '+x.nom).indexOf(t)<0)return false;
    if(stF==='nonotes')return !x.hasNotes;if(stF!=='all')return x.status===stF;return true;});
  var html='<div class="card"><div style="display:flex;flex-wrap:wrap;gap:8px"><input id="stQ" placeholder="Rechercher un matricule ou un nom…" value="'+esc(stQ)+'" style="max-width:320px">'+
   '<select id="stF" style="width:auto">'+[['all','Tous les élèves'],['approved','Demande approuvée'],['rejected','Demande rejetée'],['pending','En attente'],['nonotes','Sans notes']].map(function(o){return '<option value="'+o[0]+'"'+(stF===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'+
   '<button class="primary" id="stAdd">+ Ajouter un élève</button></div>'+
   '<label>Moyenne minimale pour approuver une demande (vide = désactivée)</label><div style="display:flex;gap:8px"><input id="stMin" style="max-width:160px" placeholder="Désactivée" value="'+esc(s.attestation_min_avg||'')+'"><button class="ghost" id="stMinSave">Enregistrer</button></div></div>';
  if(stForm){html+='<div class="card" style="border:2px solid var(--blue)"><h3>'+(stForm.id?"Modifier l'élève":'Ajouter un élève')+'</h3><div class="grid">'+
    [['matricule','Matricule (donné par la société) *'],['nom','Nom *'],['prenom','Prénom *'],['phone','Téléphone'],['email','E-mail (facultatif)']].map(function(f){return '<div><label>'+f[1]+'</label><input data-sf="'+f[0]+'" value="'+esc(stForm[f[0]]||'')+'"></div>';}).join('')+
    '</div><p><button class="primary" id="stSave">Enregistrer</button> <button class="ghost" id="stCancel">Annuler</button></p></div>';}
  html+='<div class="card">'+(list.length?list.map(function(x){
    var c=x.status==='approved'?'#1f56a5':x.status==='rejected'?'#c0392b':'#5b6478';
    return '<div style="border-bottom:1px solid var(--bd)"><div data-sto="'+x.id+'" style="display:flex;gap:10px;flex-wrap:wrap;padding:10px 4px;cursor:pointer"><b style="min-width:110px;font-family:monospace">'+esc(x.matricule)+'</b><span style="flex:1">'+esc(x.nom+' '+x.prenom)+'</span>'+
      (x.hasNotes?'':'<small class="hint">Sans notes</small>')+'<span style="color:#fff;background:'+c+';border-radius:6px;padding:2px 8px;font-size:12px">'+ST_LBL[x.status]+'</span></div>'+
      (stOpen===x.id?'<div id="stCard">'+cardHtml()+'</div>':'')+'</div>';}).join(''):'<p><small class="hint">Aucun élève trouvé.</small></p>')+'</div>';
  v.innerHTML=html;bindStudents(v);
}
function gradeHtml(k,title){var t=stDetail.grades[k];
  return '<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3 style="margin:0">'+title+' — moyenne générale : '+f2(tabAvg(t))+'/20</h3><span><button class="ghost" data-gaddr="'+k+'">+ Matière</button> <button class="ghost" data-gaddc="'+k+'">+ Devoir</button></span></div>'+
  '<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;margin-top:8px"><tr><th style="text-align:left">Matière</th>'+
  t.cols.map(function(c,ci){return '<th><div style="display:flex;gap:2px"><input data-gcol="'+k+':'+ci+'" value="'+esc(c)+'" style="min-width:90px"><button class="ghost" data-gdelc="'+k+':'+ci+'">✕</button></div></th>';}).join('')+'<th>Moyenne</th><th></th></tr>'+
  t.rows.map(function(r,ri){return '<tr><td><input data-grow="'+k+':'+ri+'" value="'+esc(r.name)+'" style="min-width:120px"></td>'+
    t.cols.map(function(_,ci){var n=r.notes[ci];return '<td><input data-gcell="'+k+':'+ri+':'+ci+'" inputmode="decimal" placeholder="/20" value="'+(n==null?'':esc(n))+'" style="width:70px;text-align:center"></td>';}).join('')+
    '<td style="text-align:center"><b>'+f2(rowAvg(r))+'</b></td><td><button class="ghost" data-gdelr="'+k+':'+ri+'">✕</button></td></tr>';}).join('')+
  (t.rows.length?'':'<tr><td colspan="9"><small class="hint">Aucune matière. Cliquez sur « + Matière ».</small></td></tr>')+'</table></div></div>';}
function cardHtml(){if(!stDetail)return '<p><small class="hint">Chargement de la fiche…</small></p>';var d=stDetail;
  return '<div style="background:#f5f7fb;padding:12px;border-radius:10px;margin-bottom:10px"><p style="font-size:17px;margin:0"><b>'+esc(d.nom+' '+d.prenom)+'</b></p><small class="hint">Matricule <b>'+esc(d.matricule)+'</b> · '+esc(d.phone||'—')+' · '+esc(d.email||"pas d'e-mail")+'</small>'+
  '<p><button class="ghost" id="stEdit">Modifier</button> <button class="ghost" id="stPhoto">Photo non conforme</button> <button class="ghost" id="stDel" style="color:#c0392b">Supprimer</button></p>'+
  gradeHtml('theorie','Théorie')+gradeHtml('pratique','Pratique')+'<p><button class="primary" id="stGrades">Enregistrer les notes</button></p>'+
  '<h3>Demandes et documents</h3>'+(d.requestsList.length?d.requestsList.map(function(r){var p=r.id_type==='passeport'?'Passeport':'CIP';
    return '<div class="card" style="display:flex;gap:14px;flex-wrap:wrap">'+[["Photo d'identité",r.photo_url],[p,r.cip_url]].map(function(x){return x[1]?'<div style="text-align:center;font-size:12px"><a href="'+esc(x[1])+'" target="_blank"><img src="'+esc(x[1])+'" style="width:110px;height:110px;object-fit:cover;border-radius:8px"></a><br>'+x[0]+' · <a href="'+esc(x[1])+'" download target="_blank">Télécharger</a></div>':'';}).join('')+
    '<div style="flex:1;min-width:200px"><b style="color:'+(r.status==='approved'?'#1f56a5':'#c0392b')+'">'+(r.status==='approved'?'Approuvée':'Rejetée')+'</b><p style="margin:4px 0">'+esc(r.reason)+'</p><small class="hint">'+p+' n° '+esc(r.cip_number)+' · '+esc(r.email)+' · '+esc(r.phone)+'<br>'+new Date(r.created_at).toLocaleString('fr-FR')+'</small></div></div>';}).join(''):'<p><small class="hint">Aucune demande envoyée.</small></p>')+'</div>';}
function readGrades(v){v.querySelectorAll('[data-gcol]').forEach(function(i){var a=i.getAttribute('data-gcol').split(':');stDetail.grades[a[0]].cols[+a[1]]=i.value;});
  v.querySelectorAll('[data-grow]').forEach(function(i){var a=i.getAttribute('data-grow').split(':');stDetail.grades[a[0]].rows[+a[1]].name=i.value;});
  v.querySelectorAll('[data-gcell]').forEach(function(i){var a=i.getAttribute('data-gcell').split(':');stDetail.grades[a[0]].rows[+a[1]].notes[+a[2]]=i.value.trim()===''?null:i.value;});}
function bindStudents(v){
  var q=v.querySelector('#stQ');q.oninput=function(){stQ=q.value;var pos=q.selectionStart;studentsView(v).then(function(){var n=v.querySelector('#stQ');n.focus();n.setSelectionRange(pos,pos);});};
  q.onkeydown=function(e){if(e.key==='Enter'){var first=v.querySelector('[data-sto]');if(first)first.click();}};
  v.querySelector('#stF').onchange=function(){stF=this.value;studentsView(v);};
  v.querySelector('#stAdd').onclick=function(){stForm={matricule:'',nom:'',prenom:'',phone:'',email:''};studentsView(v);};
  v.querySelector('#stMinSave').onclick=async function(){var val=v.querySelector('#stMin').value.trim();var r=await call('saveSettings',{entries:{attestation_min_avg:val}});
    if(r.ok){var x=(site.settings||[]).filter(function(s){return s.key!=='attestation_min_avg';});x.push({key:'attestation_min_avg',value:val});site.settings=x;}
    toast(r.ok?(val?'Moyenne minimale : '+val+'/20':'Moyenne minimale désactivée.'):(r.message||'Erreur'));};
  var sv=v.querySelector('#stSave');if(sv)sv.onclick=async function(){v.querySelectorAll('[data-sf]').forEach(function(i){stForm[i.getAttribute('data-sf')]=i.value;});
    var r=await call('saveStudent',stForm);if(!r.ok){toast(r.message||'Erreur');return;}toast(stForm.id?'Élève modifié.':'Élève ajouté.');stForm=null;stList=null;stOpen=r.id;stDetail=null;await studentsView(v);openStudent(v,r.id);};
  var sc=v.querySelector('#stCancel');if(sc)sc.onclick=function(){stForm=null;studentsView(v);};
  v.querySelectorAll('[data-sto]').forEach(function(el){el.onclick=function(){var id=el.getAttribute('data-sto');if(stOpen===id){stOpen=null;studentsView(v);}else openStudent(v,id);};});
  if(!stDetail)return;
  v.querySelectorAll('[data-gcell],[data-grow],[data-gcol]').forEach(function(i){i.onchange=function(){readGrades(v);var c=v.querySelector('#stCard');c.innerHTML=cardHtml();bindStudents(v);};});
  var act=function(sel,fn){v.querySelectorAll('['+sel+']').forEach(function(b){b.onclick=function(){readGrades(v);var a=b.getAttribute(sel).split(':'),t=stDetail.grades[a[0]];fn(t,+a[1]);v.querySelector('#stCard').innerHTML=cardHtml();bindStudents(v);};});};
  act('data-gaddr',function(t){t.rows.push({name:'Matière '+(t.rows.length+1),notes:t.cols.map(function(){return null;})});});
  act('data-gaddc',function(t){t.cols.push('Devoir '+(t.cols.length+1));t.rows.forEach(function(r){r.notes.push(null);});});
  act('data-gdelr',function(t,i){t.rows.splice(i,1);});
  act('data-gdelc',function(t,i){t.cols.splice(i,1);t.rows.forEach(function(r){r.notes.splice(i,1);});});
  v.querySelector('#stGrades').onclick=async function(){readGrades(v);this.disabled=true;this.textContent='Enregistrement…';var r=await call('saveGrades',{id:stDetail.id,grades:stDetail.grades});toast(r.ok?'Notes enregistrées.':(r.message||'Erreur'));stList=null;var id=stDetail.id;stDetail=null;await studentsView(v);openStudent(v,id);};
  v.querySelector('#stEdit').onclick=function(){var d=stDetail;stForm={id:d.id,matricule:d.matricule,nom:d.nom,prenom:d.prenom,phone:d.phone,email:d.email};studentsView(v);};
  v.querySelector('#stPhoto').onclick=async function(){var r=await call('photoNonConforme',{id:stDetail.id});toast(r.message||'Erreur');};
  v.querySelector('#stDel').onclick=async function(){if(!confirm('Supprimer définitivement cet élève et ses documents ?'))return;var r=await call('deleteStudent',{id:stDetail.id});toast(r.ok?'Élève supprimé.':(r.message||'Erreur'));stList=null;stOpen=null;stDetail=null;studentsView(v);};
}
async function openStudent(v,id){stOpen=id;stDetail=null;await studentsView(v);var r=await call('getStudent',{id:id});if(!r.ok){toast(r.message||'Erreur');return;}stDetail=r.student;studentsView(v);}

</script>
</body>
</html>
